url: https://max578.github.io/cdzoo

template:
  bootstrap: 5

reference:
- title: Discover a graph
  desc: Run a method, or let the recommender choose one.
  contents:
  - cd_discover
  - cd_auto
  - cd_diagnose
  - cd_explain
- title: Discovery from a sufficient statistic
  desc: Run discovery on an aggregated correlation matrix rather than row-level data.
  contents:
  - cd_discover_suffstat
  - cd_correlation_from_counts
  - cd_suffstat
- title: Results
  desc: The discovery-result object and its accessors.
  contents:
  - cd_result
  - cd_edges
- title: Federation manifest
  desc: Emit and verify a versioned, integrity-hashed result manifest.
  contents:
  - as_orchestra_manifest
  - verify_manifest
  - orchestra_manifest
- title: The method registry
  desc: Inspect and extend the portfolio of methods.
  contents:
  - list_methods
  - register_method
  - cd_method
- title: Scenarios, metrics, and benchmarking
  desc: Generate known-truth data and score recovered graphs.
  contents:
  - cd_scenario
  - cd_scenarios
  - cd_score
  - cd_benchmark
  - cd_field_benchmark
